name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fusionlab
          POSTGRES_PASSWORD: fusionlab
          POSTGRES_DB: fusionlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fusionlab -d fusionlab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fusionlab:fusionlab@localhost:5432/fusionlab
      # Next imports Firebase Auth during static page collection. These are
      # build-only placeholders: CI does not authenticate against Firebase.
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-build-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-build-placeholder.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-build-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Prisma 7 does not generate this client's model types during npm ci.
      # Run from the API package so Prisma also finds prisma.config.ts.
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run lint
      # LayoutProps is generated by Next.js; a clean checkout has no .next yet.
      - run: npx next typegen
        working-directory: apps/web
      - run: npm run typecheck
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm run build
      - run: npm run test
